<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Parker Ortanes, Finance and Accounting at CU Boulder">
  <style>
    .name   { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f5f7fa; letter-spacing: 2px; }
    .tag    { font: 400 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb0c3; }
    .mono   { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .tick   { font-size: 16px; fill: #e6edf3; }
    .up     { fill: #3fb950; }
    .sym    { font-size: 15px; fill: #9fb0c3; }
    .chart  { fill: none; stroke: #3fb950; stroke-width: 2.5; stroke-dasharray: 1400; stroke-dashoffset: 1400;
              animation: draw 3s ease-out forwards; }
    .scroll { animation: scroll 32s linear infinite; }
    .dot    { animation: blink 1.4s ease-in-out infinite; }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1460px); } }
    @keyframes blink  { 50% { opacity: 0.2; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- background + grid -->
  <rect width="1200" height="260" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="214" fill="url(#grid)"/>

  <!-- price chart that draws itself on load -->
  <path d="M560 190 L600 180 L640 186 L680 165 L720 172 L760 150 L800 158 L840 128 L880 136 L920 105 L960 114 L1000 84 L1040 92 L1080 60 L1120 68 L1160 40 L1160 214 L560 214 Z" fill="url(#fill)"/>
  <path class="chart" d="M560 190 L600 180 L640 186 L680 165 L720 172 L760 150 L800 158 L840 128 L880 136 L920 105 L960 114 L1000 84 L1040 92 L1080 60 L1120 68 L1160 40"/>

  <!-- quote box, top right -->
  <g class="mono">
    <circle class="dot" cx="1062" cy="30" r="5" fill="#3fb950"/>
    <text x="1074" y="35" class="sym">PRKR <tspan class="up">▲ LIVE</tspan></text>
  </g>

  <!-- name + tagline -->
  <text x="48" y="112" class="name">PARKER ORTANES</text>
  <rect x="50" y="130" width="72" height="4" rx="2" fill="#3fb950"/>
  <text x="48" y="170" class="tag">Finance &amp; Accounting · CU Boulder Leeds '28 · Boulder, CO</text>

  <!-- ticker tape -->
  <rect y="214" width="1200" height="46" fill="#060b14"/>
  <rect y="214" width="1200" height="1" fill="#3fb950" fill-opacity="0.5"/>
  <g class="scroll mono tick">
    <text xml:space="preserve" x="0" y="243" textLength="1460" lengthAdjust="spacingAndGlyphs"><tspan class="up">  ▲</tspan> IB SUMMER ANALYST · CANACCORD GENUITY '27   <tspan class="up">▲</tspan> MADRID · UC3M SPRING '27   <tspan class="up">▲</tspan> CU BOULDER LEEDS '28   <tspan class="up">▲</tspan> LEEDS SCHOLARS   <tspan class="up">▲</tspan> DCF · COMPS · EXCEL · PYTHON </text>
    <text xml:space="preserve" x="1460" y="243" textLength="1460" lengthAdjust="spacingAndGlyphs"><tspan class="up">  ▲</tspan> IB SUMMER ANALYST · CANACCORD GENUITY '27   <tspan class="up">▲</tspan> MADRID · UC3M SPRING '27   <tspan class="up">▲</tspan> CU BOULDER LEEDS '28   <tspan class="up">▲</tspan> LEEDS SCHOLARS   <tspan class="up">▲</tspan> DCF · COMPS · EXCEL · PYTHON </text>
  </g>
</svg>
