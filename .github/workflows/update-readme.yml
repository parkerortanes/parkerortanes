name: Update README

on:
  schedule:
    - cron: "17 13 * * *"      # every day ~7am Mountain
  push:
    paths:
      - profile.yml            # rebuild immediately when you log a career update
      - update_readme.py
      - banner.py
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Rebuild README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python update_readme.py

      - name: Commit if changed
        run: |
          git config user.name  "readme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/banner.svg
          git diff --cached --quiet || git commit -m "chore: auto-update README"
          git push
